name: Deploy to Cloud Functions

on:
  workflow_dispatch:   # run manually from the GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Recreate .env from GitHub Secrets ─────────────────────────────────
      - name: Recreate .env
        run: |
          cat > .env << 'EOF'
          GOOGLE_FUNCTION_SOURCE: "${{ secrets.GOOGLE_FUNCTION_SOURCE }}"
          ALLOWED_ORIGIN: "${{ secrets.ALLOWED_ORIGIN }}"
          PROMPT_BUCKET: "${{ secrets.PROMPT_BUCKET }}"
          GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
          PINECONE_API_KEY: "${{ secrets.PINECONE_API_KEY }}"
          PINECONE_HOST: "${{ secrets.PINECONE_HOST }}"
          LOG_LEVEL: "${{ secrets.LOG_LEVEL }}"
          TOKEN_SECRET: "${{ secrets.TOKEN_SECRET }}"
          GMAIL_USER: "${{ secrets.GMAIL_USER }}"
          GMAIL_APP_PASSWORD: "${{ secrets.GMAIL_APP_PASSWORD }}"
          EOF

      # ── Generate env.yaml from .env ────────────────────────────────────────
      - name: Generate env.yaml
        run: python api/deploy/gen_env_yaml.py

      # ── Authenticate to Google Cloud ───────────────────────────────────────
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: nyc-health-law-bot

      # ── Deploy Cloud Function ──────────────────────────────────────────────
      - name: Deploy Cloud Function
        run: |
          cp api/cloud_function.py api/deploy/main.py
          gcloud functions deploy law-bot \
            --gen2 \
            --runtime python312 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point handle_request \
            --region us-east1 \
            --project nyc-health-law-bot \
            --source api/deploy \
            --env-vars-file api/deploy/env.yaml \
            --min-instances 1 \
            --quiet
